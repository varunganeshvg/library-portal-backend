<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>register</title>
	<link rel="stylesheet" href="/Register.css">
	<img src="/regimage.jpg" alt="Register Image">

</head>
<body>
    <center>
<div class="container">   
    <h1>REGISTER</h1>   
    <h1>PLEASE ENTER YOUR DETAILS</h1>
    <form  class="formreg" method="post">


    <div class="rname">
        <label for="">name </label><input type="text" name="name"placeholder="enter your name" required> <br>
    </div>    
      
                               
    <div class="remail">                         
        <label for="">email</label><input type="email" name="email" required><br>
    </div>    


    <div class="rpass">
        <label for="">password </label><input type="password" name="password" placeholder="enter your password" required><br>
    </div>  

    <div class="rrole">

        <label for="">role </label>
        <select name="role" id="">
            <option  value="student">student</option>
            <option value="staff">staff</option>
            <option value="admin">admin</option>
        </select><br>
    </div>    
    <div class="subres">
        <input type="submit" value="submit"><br>
        <input type="reset" value ="reset">
    </div>    
    </form>

    <p>Already have an account?<a href="login.html">login</a></p>

</div>
    </center>
</body>
</html>
